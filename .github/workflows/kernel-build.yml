name: Camellia KernelSU Next

on:
  workflow_dispatch:
  push:
    branches:
      - lineage-23.2

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-22.04

    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================

      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ==========================================
      # DEPENDENCIES
      # ==========================================

      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            ca-certificates \
            curl \
            device-tree-compiler \
            flex \
            git \
            libelf-dev \
            libssl-dev \
            lld \
            make \
            python3 \
            rsync \
            unzip \
            wget \
            xz-utils \
            zip

      # ==========================================
      # ANDROID CLANG R383902
      # ==========================================

      - name: Download Android Clang r383902
        run: |
          mkdir -p "$HOME/toolchains"

          git clone \
            --depth=1 \
            --branch android12-release \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 \
            "$HOME/toolchains/clang-source"

          mkdir -p "$HOME/toolchains/clang"

          cp -a \
            "$HOME/toolchains/clang-source/clang-r383902/." \
            "$HOME/toolchains/clang/"

          echo "========== CLANG =========="

          "$HOME/toolchains/clang/bin/clang" --version

      # ==========================================
      # ANDROID GCC 4.9
      # ==========================================

      - name: Download Android GCC 4.9
        run: |
          mkdir -p "$HOME/toolchains"

          git clone \
            --depth=1 \
            --branch android-7.1.2_r3 \
            https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 \
            "$HOME/toolchains/gcc"

          echo "========== GCC =========="

          "$HOME/toolchains/gcc/bin/aarch64-linux-androidkernel-gcc" \
            --version

          echo
          echo "========== GCC AS =========="

          "$HOME/toolchains/gcc/bin/aarch64-linux-androidkernel-as" \
            --version

      # ==========================================
      # TOOLCHAIN PATH
      # ==========================================

      - name: Setup toolchain
        run: |
          echo "$HOME/toolchains/clang/bin" >> "$GITHUB_PATH"
          echo "$HOME/toolchains/gcc/bin" >> "$GITHUB_PATH"

          echo "CLANG_PREBUILT_BIN=$HOME/toolchains/clang/bin" >> "$GITHUB_ENV"

          echo "LINUX_GCC_CROSS_COMPILE_PREBUILTS_BIN=$HOME/toolchains/gcc/bin" >> "$GITHUB_ENV"

      # ==========================================
      # KERNELSU NEXT
      # ==========================================

      - name: Integrate KernelSU Next
        run: |
          curl -LSs \
            "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" \
            | bash -s legacy

      # ==========================================
      # CONFIGURE KERNEL
      # ==========================================

      - name: Configure kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64

          echo "========== DEFCONFIG =========="

          make O=out \
            ARCH=arm64 \
            camellian_defconfig

          echo
          echo "========== ENABLE KERNELSU =========="

          ./scripts/config --file out/.config \
            -e CONFIG_KSU \
            -e CONFIG_KPROBES \
            -e CONFIG_KPROBE_EVENTS \
            -e CONFIG_KSU_KPROBE_HOOKS

          echo
          echo "========== DISABLE MISSING MILLET MODULE =========="

          ./scripts/config --file out/.config \
            -d CONFIG_MILLET || true

          make O=out \
            ARCH=arm64 \
            olddefconfig

          echo
          echo "========== FINAL CONFIG =========="

          grep -E \
            'CONFIG_KSU=|CONFIG_KPROBES=|CONFIG_KPROBE_EVENTS=|CONFIG_KSU_KPROBE_HOOKS=|CONFIG_MILLET=' \
            out/.config || true

      # ==========================================
      # CHECK MILLET SOURCE
      # ==========================================

      - name: Check Xiaomi MIHW
        run: |
          echo "========== MILLET SOURCE =========="

          if [ -d "vendor/xiaomi/kernel_modules/mihw/millet" ]; then
            echo "MIHW millet source FOUND."
          else
            echo "MIHW millet source NOT FOUND."
            echo "CONFIG_MILLET has been disabled."
          fi

      # ==========================================
      # FIX OLD CLANG ASSEMBLER
      # ==========================================

      - name: Enable Clang integrated assembler
        run: |
          echo "========== BEFORE PATCH =========="

          grep -n \
            "integrated-as" \
            Makefile || true

          echo
          echo "========== PATCH =========="

          sed -i \
            's/-no-integrated-as/-integrated-as/g' \
            Makefile

          echo
          echo "========== AFTER PATCH =========="

          grep -n \
            "integrated-as" \
            Makefile || true

          echo
          echo "The old 4.14 tree is now forced to use Clang's integrated assembler."

      # ==========================================
      # VERIFY TOOLCHAIN
      # ==========================================

      - name: Verify build environment
        run: |
          export PATH="$HOME/toolchains/clang/bin:$HOME/toolchains/gcc/bin:$PATH"

          echo "========== CLANG =========="

          which clang
          clang --version

          echo
          echo "========== GCC =========="

          which aarch64-linux-androidkernel-gcc
          aarch64-linux-androidkernel-gcc --version

          echo
          echo "========== AS =========="

          which aarch64-linux-androidkernel-as
          aarch64-linux-androidkernel-as --version

          echo
          echo "========== CONFIG =========="

          grep -E \
            'CONFIG_KSU=|CONFIG_MILLET=' \
            out/.config || true

      # ==========================================
      # BUILD KERNEL
      # ==========================================

      - name: Build kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64

          export PATH="$HOME/toolchains/clang/bin:$HOME/toolchains/gcc/bin:$PATH"

          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-androidkernel-

          export CC="$HOME/toolchains/clang/bin/clang"
          export LD="$HOME/toolchains/clang/bin/ld.lld"
          export NM="$HOME/toolchains/clang/bin/llvm-nm"
          export AR="$HOME/toolchains/clang/bin/llvm-ar"
          export OBJCOPY="$HOME/toolchains/clang/bin/llvm-objcopy"
          export OBJDUMP="$HOME/toolchains/clang/bin/llvm-objdump"
          export STRIP="$HOME/toolchains/clang/bin/llvm-strip"

          export CLANG_PREBUILT_BIN="$HOME/toolchains/clang/bin"

          export LINUX_GCC_CROSS_COMPILE_PREBUILTS_BIN="$HOME/toolchains/gcc/bin"

          export LD_LIBRARY_PATH="$HOME/toolchains/clang/lib64:$LD_LIBRARY_PATH"

          echo "========== BUILD ENVIRONMENT =========="

          echo "ARCH=$ARCH"
          echo "SUBARCH=$SUBARCH"
          echo "CLANG_TRIPLE=$CLANG_TRIPLE"
          echo "CROSS_COMPILE=$CROSS_COMPILE"
          echo "CC=$CC"
          echo "LD=$LD"

          echo
          echo "========== KERNELSU =========="

          grep CONFIG_KSU out/.config || true

          echo
          echo "========== MILLET =========="

          grep CONFIG_MILLET out/.config || true

          echo
          echo "========== BUILD =========="

          make -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            SUBARCH=arm64 \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CLANG_TRIPLE="$CLANG_TRIPLE" \
            CC="$CC" \
            LD="$LD" \
            AR="$AR" \
            NM="$NM" \
            OBJCOPY="$OBJCOPY" \
            OBJDUMP="$OBJDUMP" \
            STRIP="$STRIP" \
            LLVM_IAS=1

      # ==========================================
      # CHECK OUTPUT
      # ==========================================

      - name: Check kernel output
        if: success()
        run: |
          echo "========== KERNEL OUTPUT =========="

          find out/arch/arm64/boot \
            -maxdepth 3 \
            -type f \
            -print | sort

          echo
          echo "========== KERNEL IMAGES =========="

          ls -lh \
            out/arch/arm64/boot/Image \
            out/arch/arm64/boot/Image.gz \
            out/arch/arm64/boot/Image.gz-dtb \
            2>/dev/null || true

      # ==========================================
      # PREPARE ARTIFACT
      # ==========================================

      - name: Prepare kernel artifact
        if: success()
        run: |
          mkdir -p release

          if [ -f out/arch/arm64/boot/Image ]; then
            cp out/arch/arm64/boot/Image \
              release/Image
          fi

          if [ -f out/arch/arm64/boot/Image.gz ]; then
            cp out/arch/arm64/boot/Image.gz \
              release/Image.gz
          fi

          if [ -f out/arch/arm64/boot/Image.gz-dtb ]; then
            cp out/arch/arm64/boot/Image.gz-dtb \
              release/Image.gz-dtb
          fi

          if [ -f out/vmlinux ]; then
            cp out/vmlinux \
              release/vmlinux
          fi

          cp out/.config \
            release/kernel.config

          echo "========== RELEASE FILES =========="

          ls -lah release/

      # ==========================================
      # UPLOAD
      # ==========================================

      - name: Upload KernelSU kernel
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Camellia-KernelSU-Next
          path: release/
