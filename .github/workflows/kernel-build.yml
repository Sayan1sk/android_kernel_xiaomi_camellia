name: Camellia KernelSU Next

on:
  workflow_dispatch:
  push:
    branches:
      - lineage-23.2

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-22.04

    steps:

      # ==========================================
      # SOURCE
      # ==========================================

      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ==========================================
      # DEPENDENCIES
      # ==========================================

      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            curl \
            device-tree-compiler \
            flex \
            git \
            libelf-dev \
            libssl-dev \
            lld \
            make \
            python3 \
            rsync \
            unzip \
            wget \
            xz-utils \
            zip

      # ==========================================
      # ANDROID CLANG R383902
      # ==========================================

      - name: Download Android Clang r383902
        run: |
          mkdir -p "$HOME/toolchains"

          git clone \
            --depth=1 \
            --branch android-12.0.0_r24 \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 \
            "$HOME/toolchains/clang-source"

          mkdir -p "$HOME/toolchains/clang"

          cp -a \
            "$HOME/toolchains/clang-source/clang-r383902/." \
            "$HOME/toolchains/clang/"

          echo "========== CLANG =========="
          "$HOME/toolchains/clang/bin/clang" --version

      # ==========================================
      # ANDROID GCC 4.9
      # ==========================================

      - name: Download Android GCC 4.9
        run: |
          mkdir -p "$HOME/toolchains"

          git clone \
            --depth=1 \
            --branch android-7.1.2_r3 \
            https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 \
            "$HOME/toolchains/gcc"

          echo "========== GCC BINARIES =========="
          ls -lah "$HOME/toolchains/gcc/bin"

          echo
          echo "========== GCC =========="

          "$HOME/toolchains/gcc/bin/aarch64-linux-androidkernel-gcc" \
            --version

          echo
          echo "========== GCC AS =========="

          "$HOME/toolchains/gcc/bin/aarch64-linux-androidkernel-as" \
            --version

      # ==========================================
      # TOOLCHAIN PATH
      # ==========================================

      - name: Setup toolchain
        run: |
          echo "$HOME/toolchains/clang/bin" >> "$GITHUB_PATH"
          echo "$HOME/toolchains/gcc/bin" >> "$GITHUB_PATH"

          echo "CLANG_PREBUILT_BIN=$HOME/toolchains/clang/bin" >> "$GITHUB_ENV"
          echo "GCC_PREBUILT_BIN=$HOME/toolchains/gcc/bin" >> "$GITHUB_ENV"

      # ==========================================
      # KERNELSU NEXT
      # ==========================================

      - name: Integrate KernelSU Next
        run: |
          curl -LSs \
            "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" \
            | bash -s legacy

      # ==========================================
      # KERNEL CONFIG
      # ==========================================

      - name: Configure kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64

          make O=out ARCH=arm64 camellian_defconfig

          echo "========== ENABLE KERNELSU =========="

          ./scripts/config --file out/.config \
            -e CONFIG_KSU \
            -e CONFIG_KPROBES \
            -e CONFIG_KPROBE_EVENTS \
            -e CONFIG_KSU_KPROBE_HOOKS

          make O=out ARCH=arm64 olddefconfig

          echo
          echo "========== KERNELSU CONFIG =========="

          grep -E \
            'CONFIG_KSU=|CONFIG_KPROBES=|CONFIG_KPROBE_EVENTS=|CONFIG_KSU_KPROBE_HOOKS=' \
            out/.config || true

      # ==========================================
      # CHECK EXTERNAL XIAOMI MODULE
      # ==========================================

      - name: Check Xiaomi MIHW source
        run: |
          echo "========== CHECKING MIHW =========="

          if [ -d "vendor/xiaomi/kernel_modules/mihw/millet" ]; then
            echo "MIHW millet source FOUND."
            find vendor/xiaomi/kernel_modules/mihw/millet \
              -maxdepth 2 \
              -type f | head -50
          else
            echo "WARNING:"
            echo "vendor/xiaomi/kernel_modules/mihw/millet"
            echo "is NOT present in this repository."

            echo
            echo "References to millet:"
            grep -Rni \
              "kernel_modules/mihw/millet" \
              --include="Makefile" \
              --include="Kconfig" \
              . || true
          fi

      # ==========================================
      # BUILD
      # ==========================================

      - name: Build kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64

          export PATH="$HOME/toolchains/clang/bin:$HOME/toolchains/gcc/bin:$PATH"

          export CLANG_TRIPLE=aarch64-linux-gnu-

          export CROSS_COMPILE=aarch64-linux-androidkernel-

          export CC=clang
          export LD=ld.lld
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy

          export CLANG_PREBUILT_BIN="$HOME/toolchains/clang/bin"
          export LINUX_GCC_CROSS_COMPILE_PREBUILTS_BIN="$HOME/toolchains/gcc/bin"

          export LD_LIBRARY_PATH="$HOME/toolchains/clang/lib64:$LD_LIBRARY_PATH"

          echo "========== BUILD ENVIRONMENT =========="

          echo "ARCH=$ARCH"
          echo "CROSS_COMPILE=$CROSS_COMPILE"
          echo "CLANG_TRIPLE=$CLANG_TRIPLE"
          echo "CC=$CC"
          echo "LD=$LD"

          echo
          echo "========== COMPILER =========="

          which clang
          clang --version

          echo
          echo "========== CROSS GCC =========="

          which aarch64-linux-androidkernel-gcc
          aarch64-linux-androidkernel-gcc --version

          echo
          echo "========== CROSS AS =========="

          which aarch64-linux-androidkernel-as
          aarch64-linux-androidkernel-as --version

          echo
          echo "========== START BUILD =========="

          make -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            SUBARCH=arm64 \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CLANG_TRIPLE="$CLANG_TRIPLE" \
            CC="$CC" \
            LD="$LD" \
            NM="$NM" \
            OBJCOPY="$OBJCOPY"

      # ==========================================
      # CHECK OUTPUT
      # ==========================================

      - name: Check kernel output
        if: success()
        run: |
          echo "========== KERNEL OUTPUT =========="

          find out/arch/arm64/boot \
            -maxdepth 3 \
            -type f \
            -print | sort

          echo
          echo "========== IMAGE =========="

          ls -lh \
            out/arch/arm64/boot/Image \
            out/arch/arm64/boot/Image.gz \
            out/arch/arm64/boot/Image.gz-dtb \
            2>/dev/null || true

      # ==========================================
      # PREPARE ARTIFACT
      # ==========================================

      - name: Prepare kernel artifact
        if: success()
        run: |
          mkdir -p release

          if [ -f out/arch/arm64/boot/Image.gz-dtb ]; then
            cp out/arch/arm64/boot/Image.gz-dtb \
              release/Image.gz-dtb
          fi

          if [ -f out/arch/arm64/boot/Image.gz ]; then
            cp out/arch/arm64/boot/Image.gz \
              release/Image.gz
          fi

          if [ -f out/arch/arm64/boot/Image ]; then
            cp out/arch/arm64/boot/Image \
              release/Image
          fi

          cp out/.config release/kernel.config

          echo
          echo "========== ARTIFACT =========="

          ls -lah release/

      # ==========================================
      # UPLOAD
      # ==========================================

      - name: Upload KernelSU kernel
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Camellia-KernelSU-Next
          path: release/
