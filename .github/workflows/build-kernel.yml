name: Kernel Build Worker

on:
  workflow_call:
    inputs:

      build_target:
        required: true
        type: string

      ksu_fork:
        required: true
        type: string

      manifest_name:
        required: true
        type: string

      include_susfs:
        required: true
        type: boolean

      include_droidspace:
        required: true
        type: boolean

      include_bbg:
        required: true
        type: boolean

      toolchain:
        required: true
        type: string

      include_lto_o3:
        required: true
        type: boolean

      include_wireguard:
        required: true
        type: boolean

      include_f2fs:
        required: true
        type: boolean

      include_zstd:
        required: true
        type: boolean

      include_bbr:
        required: true
        type: boolean

      include_ttl:
        required: true
        type: boolean


jobs:

  build:
    name: Build Camellia Kernel
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout kernel source
        uses: actions/checkout@v4


      # ============================================================
      # CONFIGURATION
      # ============================================================

      - name: Show configuration
        run: |
          echo "=========================================="
          echo "       CAMELLIA KERNEL BUILD"
          echo "=========================================="

          echo "Build target : ${{ inputs.build_target }}"
          echo "KernelSU     : ${{ inputs.ksu_fork }}"
          echo "Manifest     : ${{ inputs.manifest_name }}"
          echo "Toolchain    : ${{ inputs.toolchain }}"

          echo "SUSFS        : ${{ inputs.include_susfs }}"
          echo "DroidSpace   : ${{ inputs.include_droidspace }}"
          echo "BBG          : ${{ inputs.include_bbg }}"
          echo "LTO/O3       : ${{ inputs.include_lto_o3 }}"
          echo "WireGuard    : ${{ inputs.include_wireguard }}"
          echo "F2FS         : ${{ inputs.include_f2fs }}"
          echo "ZSTD         : ${{ inputs.include_zstd }}"
          echo "BBR          : ${{ inputs.include_bbr }}"
          echo "TTL          : ${{ inputs.include_ttl }}"

          echo "=========================================="


      # ============================================================
      # DEPENDENCIES
      # ============================================================

      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            flex \
            git \
            libelf-dev \
            libssl-dev \
            lld \
            python3 \
            rsync \
            unzip \
            wget \
            zip


      # ============================================================
      # CLANG 11
      # ============================================================

      - name: Download Android Clang 11
        run: |

          mkdir -p "$HOME/toolchains"

          git clone \
            --depth=1 \
            --branch android12-release \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 \
            "$HOME/toolchains/clang-source"

          mkdir -p "$HOME/toolchains/clang"

          cp -a \
            "$HOME/toolchains/clang-source/clang-r383902/." \
            "$HOME/toolchains/clang/"

          echo "=========================================="
          echo "CLANG VERSION"
          echo "=========================================="

          "$HOME/toolchains/clang/bin/clang" --version


      # ============================================================
      # GCC 4.9
      # ============================================================

      - name: Download Android GCC 4.9
        run: |

          git clone \
            --depth=1 \
            --branch android-7.1.2_r3 \
            https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 \
            "$HOME/toolchains/gcc"

          echo "=========================================="
          echo "GCC VERSION"
          echo "=========================================="

          "$HOME/toolchains/gcc/bin/aarch64-linux-androidkernel-gcc" \
            --version


      # ============================================================
      # TOOLCHAIN CHECK
      # ============================================================

      - name: Verify toolchain
        run: |

          export PATH="$HOME/toolchains/clang/bin:$HOME/toolchains/gcc/bin:$PATH"

          echo "=========================================="
          echo "TOOLCHAIN CHECK"
          echo "=========================================="

          which clang
          which aarch64-linux-androidkernel-gcc
          which aarch64-linux-androidkernel-as

          clang --version
          aarch64-linux-androidkernel-gcc --version


      # ============================================================
      # KERNELSU NEXT
      # ============================================================

      - name: Setup KernelSU Next
        if: inputs.ksu_fork == 'KSU-Next'
        run: |

          curl -LSs \
            https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh \
            | bash -s legacy


      # ============================================================
      # CONFIGURE CAMELLIA
      # ============================================================

      - name: Configure Camellia
        run: |

          export PATH="$HOME/toolchains/clang/bin:$HOME/toolchains/gcc/bin:$PATH"

          echo "=========================================="
          echo "CONFIGURING CAMELLIA"
          echo "=========================================="

          make O=out \
            ARCH=arm64 \
            camellian_defconfig

          ./scripts/config --file out/.config \
            -e CONFIG_KSU \
            -e CONFIG_KPROBES \
            -e CONFIG_KPROBE_EVENTS \
            -e CONFIG_KSU_KPROBE_HOOKS \
            -d CONFIG_MILLET

          make O=out \
            ARCH=arm64 \
            olddefconfig

          echo
          echo "========== KERNELSU =========="

          grep CONFIG_KSU out/.config || true

          echo
          echo "========== MILLET =========="

          grep CONFIG_MILLET out/.config || true


      # ============================================================
      # FIX VDSO
      # ============================================================

      - name: Fix VDSO Clang 11 compatibility
        run: |

          python3 - <<'PY'
          from pathlib import Path

          path = Path("arch/arm64/kernel/vdso/gettimeofday.S")
          text = path.read_text()

          old = "clock_gettime_return, shift=1"
          new = "clock_gettime_return shift=1"

          count = text.count(old)

          print("Found VDSO macro calls:", count)

          if count == 0:
              print("VDSO patch already applied or source differs.")
          else:
              text = text.replace(old, new)
              path.write_text(text)
              print("VDSO Clang fix applied:", count)
          PY


      # ============================================================
      # FIX AES
      # ============================================================

      - name: Fix AES Clang 11 compatibility
        run: |

          python3 - <<'PY'
          from pathlib import Path

          path = Path("arch/arm64/crypto/aes-modes.S")
          text = path.read_text()

          target = "0x30000000200000001"

          if target not in text:
              print("AES literal not found.")
              print("AES fix may already be applied.")
              raise SystemExit(0)

          lines = text.splitlines()

          start = None
          end = None

          for i, line in enumerate(lines):

              if target in line:
                  start = i
                  break

          if start is None:
              raise SystemExit("AES literal not found.")

          for i in range(start, min(start + 20, len(lines))):

              if "v3.s[3]" in lines[i]:
                  end = i
                  break

          if end is None:
              raise SystemExit(
                  "Could not find end of AES block."
              )

          replacement = [
              "\tadd\tw7, w8, #1",
              "\tmov\tv0.16b, v4.16b",
              "\tadd\tw9, w8, #2",
              "\tmov\tv1.16b, v4.16b",
              "\tadd\tw10, w8, #3",
              "\tmov\tv2.16b, v4.16b",
              "\tmov\tv3.16b, v4.16b",
              "\trev\tw7, w7",
              "\trev\tw9, w9",
              "\trev\tw10, w10",
              "\tmov\tv1.s[3], w7",
              "\tmov\tv2.s[3], w9",
              "\tmov\tv3.s[3], w10",
          ]

          lines[start:end + 1] = replacement

          path.write_text(
              "\n".join(lines) + "\n"
          )

          print("AES Clang fix applied successfully.")
          PY

          echo
          echo "========== VERIFY AES =========="

          if grep -q \
            "0x30000000200000001" \
            arch/arm64/crypto/aes-modes.S
          then
            echo "ERROR: AES literal still exists."
            exit 1
          else
            echo "AES literal removed successfully."
          fi


      # ============================================================
      # BUILD KERNEL
      # ============================================================

      - name: Build kernel
        run: |

          export ARCH=arm64
          export SUBARCH=arm64

          export CLANG="$HOME/toolchains/clang/bin"
          export GCC="$HOME/toolchains/gcc/bin"

          export PATH="$CLANG:$GCC:$PATH"

          export CROSS_COMPILE="$GCC/aarch64-linux-androidkernel-"
          export CLANG_TRIPLE=aarch64-linux-gnu-

          export CC="$CLANG/clang"
          export LD="$CLANG/ld.lld"
          export AR="$CLANG/llvm-ar"
          export NM="$CLANG/llvm-nm"
          export OBJCOPY="$CLANG/llvm-objcopy"
          export OBJDUMP="$CLANG/llvm-objdump"
          export STRIP="$CLANG/llvm-strip"

          echo
          echo "=========================================="
          echo "       BUILDING WITH CLANG IAS"
          echo "=========================================="

          "$CC" --version

          echo
          echo "Testing Clang integrated assembler..."

          printf 'mov x0, x0\n' | \
            "$CC" \
            --target=aarch64-linux-gnu \
            -x assembler \
            -c \
            -o /tmp/test.o

          echo "Integrated assembler: OK"

          echo
          echo "=========================================="
          echo "          BUILDING KERNEL"
          echo "=========================================="

          make -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            SUBARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CLANG_TRIPLE="$CLANG_TRIPLE"


      # ============================================================
      # CHECK OUTPUT
      # ============================================================

      - name: Check kernel output
        if: success()
        run: |

          echo "=========================================="
          echo "          KERNEL OUTPUT"
          echo "=========================================="

          find out/arch/arm64/boot \
            -maxdepth 2 \
            -type f \
            -print

          echo
          echo "========== IMAGE =========="

          ls -lh \
            out/arch/arm64/boot/Image*


      # ============================================================
      # UPLOAD
      # ============================================================

      - name: Upload kernel
        if: success()
        uses: actions/upload-artifact@v4

        with:
          name: Camellia-KernelSU-Next

          path: |
            out/arch/arm64/boot/Image*
            out/.config