name: Kernel Build Worker

on:
  workflow_call:
    inputs:
      build_target:
        required: true
        type: string

      ksu_fork:
        required: true
        type: string

      manifest_name:
        required: true
        type: string

      include_susfs:
        required: true
        type: boolean

      include_droidspace:
        required: true
        type: boolean

      include_bbg:
        required: true
        type: boolean

      toolchain:
        required: true
        type: string

      include_lto_o3:
        required: true
        type: boolean

      include_wireguard:
        required: true
        type: boolean

      include_f2fs:
        required: true
        type: boolean

      include_zstd:
        required: true
        type: boolean

      include_bbr:
        required: true
        type: boolean

      include_ttl:
        required: true
        type: boolean


jobs:
  build:
    name: Build Camellia Kernel
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout kernel source
        uses: actions/checkout@v4


      # ============================================================
      # SHOW CONFIGURATION
      # ============================================================

      - name: Show configuration
        run: |
          echo "=========================================="
          echo "       CAMELLIA KERNEL BUILD"
          echo "=========================================="

          echo "Build target : ${{ inputs.build_target }}"
          echo "KernelSU     : ${{ inputs.ksu_fork }}"
          echo "Manifest     : ${{ inputs.manifest_name }}"
          echo "Toolchain    : ${{ inputs.toolchain }}"

          echo "=========================================="


      # ============================================================
      # DEPENDENCIES
      # ============================================================

      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            flex \
            git \
            libelf-dev \
            libssl-dev \
            lld \
            python3 \
            rsync \
            unzip \
            wget \
            zip


      # ============================================================
      # ANDROID CLANG 11
      # ============================================================

      - name: Download Android Clang 11
        run: |
          mkdir -p "$HOME/toolchains"

          git clone \
            --depth=1 \
            --branch android12-release \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 \
            "$HOME/toolchains/clang-source"

          mkdir -p "$HOME/toolchains/clang"

          cp -a \
            "$HOME/toolchains/clang-source/clang-r383902/." \
            "$HOME/toolchains/clang/"

          echo "========== CLANG =========="

          "$HOME/toolchains/clang/bin/clang" --version


      # ============================================================
      # ANDROID GCC 4.9
      # TARGET CROSS COMPILER ONLY
      # ============================================================

      - name: Download Android GCC 4.9
        run: |
          git clone \
            --depth=1 \
            --branch android-7.1.2_r3 \
            https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 \
            "$HOME/toolchains/gcc"

          echo "========== ANDROID GCC =========="

          "$HOME/toolchains/gcc/bin/aarch64-linux-androidkernel-gcc" \
            --version


      # ============================================================
      # KERNELSU NEXT
      # ============================================================

      - name: Setup KernelSU Next
        if: inputs.ksu_fork == 'KSU-Next'
        run: |
          curl -LSs \
            https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh \
            | bash -s legacy


      # ============================================================
      # CONFIGURE CAMELLIA
      # ============================================================

      - name: Configure Camellia
        run: |
          export PATH="$HOME/toolchains/clang/bin:$HOME/toolchains/gcc/bin:$PATH"

          make O=out \
            ARCH=arm64 \
            camellian_defconfig

          ./scripts/config --file out/.config \
            -e CONFIG_KSU \
            -e CONFIG_KPROBES \
            -e CONFIG_KPROBE_EVENTS \
            -e CONFIG_KSU_KPROBE_HOOKS \
            -d CONFIG_MILLET

          make O=out \
            ARCH=arm64 \
            olddefconfig

          echo
          echo "========== KERNELSU =========="

          grep CONFIG_KSU out/.config || true

          echo
          echo "========== KPROBES =========="

          grep CONFIG_KPROBE out/.config || true


      # ============================================================
      # FIX AES-MODES.S
      # CLANG 11 COMPATIBILITY
      # ============================================================

      - name: Fix AES Clang compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("arch/arm64/crypto/aes-modes.S")
          text = path.read_text()

          target = "0x30000000200000001"

          if target not in text:
              print("AES literal not found.")
              print("No AES fix required.")
              raise SystemExit(0)

          lines = text.splitlines()

          start = None
          end = None

          for i, line in enumerate(lines):
              if target in line:
                  start = i
                  break

          if start is None:
              raise SystemExit(
                  "ERROR: AES literal could not be located."
              )

          for i in range(start, min(start + 30, len(lines))):
              if "v3.s[3]" in lines[i]:
                  end = i
                  break

          if end is None:
              raise SystemExit(
                  "ERROR: Could not locate end of AES block."
              )

          replacement = [
              "\tadd\tw7, w8, #1",
              "\tmov\tv0.16b, v4.16b",
              "\tadd\tw9, w8, #2",
              "\tmov\tv1.16b, v4.16b",
              "\tadd\tw10, w8, #3",
              "\tmov\tv2.16b, v4.16b",
              "\tmov\tv3.16b, v4.16b",
              "\trev\tw7, w7",
              "\trev\tw9, w9",
              "\trev\tw10, w10",
              "\tmov\tv1.s[3], w7",
              "\tmov\tv2.s[3], w9",
              "\tmov\tv3.s[3], w10"
          ]

          lines[start:end + 1] = replacement

          path.write_text(
              "\n".join(lines) + "\n"
          )

          print("======================================")
          print("AES Clang compatibility fix applied")
          print("======================================")
          PY

          echo
          echo "========== VERIFY AES FIX =========="

          if grep -q \
            "0x30000000200000001" \
            arch/arm64/crypto/aes-modes.S
          then
            echo "ERROR: Old AES literal still exists!"
            exit 1
          fi

          echo "AES fix verified."


      # ============================================================
      # FIX VDSO
      # CLANG 11 COMPATIBILITY
      # ============================================================

      - name: Fix VDSO Clang compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "arch/arm64/kernel/vdso/gettimeofday.S"
          )

          text = path.read_text()

          old = "clock_gettime_return, shift=1"
          new = "clock_gettime_return shift=1"

          count = text.count(old)

          if count == 0:
              print("VDSO pattern not found.")
              print("No VDSO fix required.")
          else:
              print(
                  f"Found {count} VDSO incompatible macro calls."
              )

              text = text.replace(old, new)

              path.write_text(text)

              print("VDSO compatibility fix applied.")
          PY

          echo
          echo "========== VERIFY VDSO =========="

          if grep -n \
            "clock_gettime_return, shift=1" \
            arch/arm64/kernel/vdso/gettimeofday.S
          then
            echo "ERROR: Old VDSO syntax still exists!"
            exit 1
          fi

          echo "VDSO fix verified."


      # ============================================================
      # TOOLCHAIN SETUP
      # ============================================================

      - name: Setup build toolchain
        run: |

          export ARCH=arm64
          export SUBARCH=arm64

          export CLANG="$HOME/toolchains/clang/bin"
          export GCC="$HOME/toolchains/gcc/bin"

          export PATH="$CLANG:$GCC:$PATH"

          # ========================================================
          # ARM64 TARGET CROSS COMPILER
          # ========================================================

          export CROSS_COMPILE="$GCC/aarch64-linux-androidkernel-"

          # ========================================================
          # CLANG TARGET
          # ========================================================

          export CLANG_TRIPLE=aarch64-linux-gnu-

          export CC="$CLANG/clang"
          export LD="$CLANG/ld.lld"
          export AR="$CLANG/llvm-ar"
          export NM="$CLANG/llvm-nm"
          export OBJCOPY="$CLANG/llvm-objcopy"
          export OBJDUMP="$CLANG/llvm-objdump"
          export STRIP="$CLANG/llvm-strip"

          # ========================================================
          # IMPORTANT
          #
          # HOST tools use Ubuntu GCC.
          #
          # DO NOT use Android GCC 4.9 as HOSTCC.
          # This fixes:
          #
          # /usr/bin/as: unrecognized option '-EL'
          #
          # ========================================================

          export HOSTCC="/usr/bin/gcc"
          export HOSTCXX="/usr/bin/g++"
          export HOSTLD="/usr/bin/ld"

          echo
          echo "=========================================="
          echo "          TOOLCHAIN CONFIGURATION"
          echo "=========================================="

          echo "CC=$CC"
          echo "LD=$LD"
          echo "AR=$AR"
          echo "CROSS_COMPILE=$CROSS_COMPILE"

          echo "HOSTCC=$HOSTCC"
          echo "HOSTCXX=$HOSTCXX"
          echo "HOSTLD=$HOSTLD"

          echo
          echo "========== HOST GCC =========="

          "$HOSTCC" --version

          echo
          echo "========== CLANG =========="

          "$CC" --version

          echo
          echo "========== LLD =========="

          "$LD" --version


      # ============================================================
      # BUILD KERNEL
      # ============================================================

      - name: Build kernel
        run: |

          export ARCH=arm64
          export SUBARCH=arm64

          export CLANG="$HOME/toolchains/clang/bin"
          export GCC="$HOME/toolchains/gcc/bin"

          export PATH="$CLANG:$GCC:$PATH"

          export CROSS_COMPILE="$GCC/aarch64-linux-androidkernel-"

          export CLANG_TRIPLE=aarch64-linux-gnu-

          export CC="$CLANG/clang"
          export LD="$CLANG/ld.lld"
          export AR="$CLANG/llvm-ar"
          export NM="$CLANG/llvm-nm"
          export OBJCOPY="$CLANG/llvm-objcopy"
          export OBJDUMP="$CLANG/llvm-objdump"
          export STRIP="$CLANG/llvm-strip"

          # HOST compiler
          export HOSTCC="/usr/bin/gcc"
          export HOSTCXX="/usr/bin/g++"
          export HOSTLD="/usr/bin/ld"

          echo
          echo "=========================================="
          echo "       BUILDING CAMELLIA KERNEL"
          echo "=========================================="

          echo
          echo "CC=$CC"
          echo "LD=$LD"
          echo "CROSS_COMPILE=$CROSS_COMPILE"
          echo "HOSTCC=$HOSTCC"
          echo "HOSTLD=$HOSTLD"

          echo
          echo "========== COMPILER =========="

          "$CC" --version

          echo
          echo "========== HOST COMPILER =========="

          "$HOSTCC" --version

          echo
          echo "=========================================="
          echo "              BUILD START"
          echo "=========================================="

          make -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            SUBARCH=arm64 \
            CC="$CC" \
            LD="$LD" \
            AR="$AR" \
            NM="$NM" \
            OBJCOPY="$OBJCOPY" \
            OBJDUMP="$OBJDUMP" \
            STRIP="$STRIP" \
            HOSTCC="$HOSTCC" \
            HOSTCXX="$HOSTCXX" \
            HOSTLD="$HOSTLD" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CLANG_TRIPLE="$CLANG_TRIPLE" \
            LLVM_IAS=1


      # ============================================================
      # CHECK KERNEL
      # ============================================================

      - name: Check kernel
        if: success()
        run: |

          echo
          echo "=========================================="
          echo "             KERNEL OUTPUT"
          echo "=========================================="

          echo
          echo "========== BOOT FILES =========="

          find out/arch/arm64/boot \
            -maxdepth 2 \
            -type f \
            -print

          echo
          echo "========== IMAGE =========="

          ls -lh \
            out/arch/arm64/boot/Image \
            2>/dev/null || true

          echo
          echo "========== IMAGE.GZ =========="

          ls -lh \
            out/arch/arm64/boot/Image.gz \
            2>/dev/null || true

          echo
          echo "========== CONFIG =========="

          ls -lh \
            out/.config


      # ============================================================
      # UPLOAD ARTIFACT
      # ============================================================

      - name: Upload kernel
        if: success()
        uses: actions/upload-artifact@v4

        with:
          name: Camellia-KernelSU-Next

          path: |
            out/arch/arm64/boot/Image*
            out/.config

          if-no-files-found: error