name: Kernel Build Worker

on:
  workflow_call:
    inputs:
      build_target:
        required: true
        type: string

      ksu_fork:
        required: true
        type: string

      manifest_name:
        required: true
        type: string

      include_susfs:
        required: true
        type: boolean

      include_droidspace:
        required: true
        type: boolean

      include_bbg:
        required: true
        type: boolean

      toolchain:
        required: true
        type: string

      include_lto_o3:
        required: true
        type: boolean

      include_wireguard:
        required: true
        type: boolean

      include_f2fs:
        required: true
        type: boolean

      include_zstd:
        required: true
        type: boolean

      include_bbr:
        required: true
        type: boolean

      include_ttl:
        required: true
        type: boolean

jobs:
  build:
    name: Build Camellia Kernel
    runs-on: ubuntu-22.04

    steps:

      # ==========================================================
      # CHECKOUT
      # ==========================================================

      - name: Checkout kernel source
        uses: actions/checkout@v4


      # ==========================================================
      # CONFIGURATION
      # ==========================================================

      - name: Show configuration
        run: |
          echo "=========================================="
          echo "       CAMELLIA KERNEL BUILD"
          echo "=========================================="

          echo "Build target : ${{ inputs.build_target }}"
          echo "KernelSU     : ${{ inputs.ksu_fork }}"
          echo "Manifest     : ${{ inputs.manifest_name }}"
          echo "Toolchain    : ${{ inputs.toolchain }}"

          echo "SUSFS        : ${{ inputs.include_susfs }}"
          echo "DroidSpace   : ${{ inputs.include_droidspace }}"
          echo "BBG          : ${{ inputs.include_bbg }}"
          echo "LTO/O3       : ${{ inputs.include_lto_o3 }}"
          echo "WireGuard    : ${{ inputs.include_wireguard }}"
          echo "F2FS         : ${{ inputs.include_f2fs }}"
          echo "ZSTD         : ${{ inputs.include_zstd }}"
          echo "BBR          : ${{ inputs.include_bbr }}"
          echo "TTL          : ${{ inputs.include_ttl }}"

          echo "=========================================="


      # ==========================================================
      # DEPENDENCIES
      # ==========================================================

      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            flex \
            git \
            libelf-dev \
            libssl-dev \
            lld \
            python3 \
            rsync \
            unzip \
            wget \
            zip


      # ==========================================================
      # ANDROID CLANG 11
      # ==========================================================

      - name: Download Android Clang 11
        run: |
          mkdir -p "$HOME/toolchains"

          git clone \
            --depth=1 \
            --branch android12-release \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 \
            "$HOME/toolchains/clang-source"

          mkdir -p "$HOME/toolchains/clang"

          cp -a \
            "$HOME/toolchains/clang-source/clang-r383902/." \
            "$HOME/toolchains/clang/"

          echo "========== CLANG =========="

          "$HOME/toolchains/clang/bin/clang" --version


      # ==========================================================
      # ANDROID GCC 4.9
      # ==========================================================

      - name: Download Android GCC 4.9
        run: |
          git clone \
            --depth=1 \
            --branch android-7.1.2_r3 \
            https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 \
            "$HOME/toolchains/gcc"

          echo "========== GCC =========="

          "$HOME/toolchains/gcc/bin/aarch64-linux-androidkernel-gcc" \
            --version


      # ==========================================================
      # TOOLCHAIN CHECK
      # ==========================================================

      - name: Verify toolchain
        run: |
          export CLANG="$HOME/toolchains/clang/bin"
          export GCC="$HOME/toolchains/gcc/bin"

          export PATH="$CLANG:$GCC:$PATH"

          echo "=========================================="
          echo "           TOOLCHAIN CHECK"
          echo "=========================================="

          echo
          echo "========== CLANG =========="

          which clang
          clang --version

          echo
          echo "========== CLANG++ =========="

          which clang++
          clang++ --version

          echo
          echo "========== GCC CROSS =========="

          which aarch64-linux-androidkernel-gcc
          aarch64-linux-androidkernel-gcc --version

          echo
          echo "========== LLVM IAS TEST =========="

          cat > /tmp/test.S <<'EOF'
          .text
          .global test_function

          test_function:
              mov x0, x0
              ret
          EOF

          "$CLANG/clang" \
            --target=aarch64-linux-gnu \
            -c \
            -o /tmp/test.o \
            /tmp/test.S

          test -f /tmp/test.o

          echo "Clang integrated assembler: OK"


      # ==========================================================
      # KERNELSU NEXT
      # ==========================================================

      - name: Setup KernelSU Next
        if: inputs.ksu_fork == 'KSU-Next'
        run: |
          curl -LSs \
            https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh \
            | bash -s legacy


      # ==========================================================
      # CONFIGURE CAMELLIA
      # ==========================================================

      - name: Configure Camellia
        run: |
          export CLANG="$HOME/toolchains/clang/bin"
          export GCC="$HOME/toolchains/gcc/bin"

          export PATH="$CLANG:$GCC:$PATH"

          echo "=========================================="
          echo "       CONFIGURE CAMELLIA"
          echo "=========================================="

          make O=out \
            ARCH=arm64 \
            camellian_defconfig

          echo
          echo "========== ENABLE KERNELSU =========="

          ./scripts/config --file out/.config \
            -e CONFIG_KSU \
            -e CONFIG_KPROBES \
            -e CONFIG_KPROBE_EVENTS \
            -e CONFIG_KSU_KPROBE_HOOKS

          echo
          echo "========== DISABLE MILLET =========="

          ./scripts/config --file out/.config \
            -d CONFIG_MILLET

          make O=out \
            ARCH=arm64 \
            olddefconfig

          echo
          echo "========== KERNELSU =========="

          grep CONFIG_KSU out/.config || true

          echo
          echo "========== MILLET =========="

          grep CONFIG_MILLET out/.config || true


      # ==========================================================
      # VDSO FIX
      # ==========================================================

      - name: Fix VDSO Clang compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("arch/arm64/kernel/vdso/gettimeofday.S")

          text = path.read_text()

          old = "clock_gettime_return, shift=1"
          new = "clock_gettime_return shift=1"

          count = text.count(old)

          print("Found:", count, "VDSO occurrences")

          if count:
              text = text.replace(old, new)
              path.write_text(text)
              print("VDSO fix applied.")
          else:
              print("VDSO fix not required.")
          PY


      # ==========================================================
      # AES FIX
      # ==========================================================

      - name: Fix AES Clang compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("arch/arm64/crypto/aes-modes.S")

          lines = path.read_text().splitlines()

          target = "0x30000000200000001"

          start = None
          end = None

          for i, line in enumerate(lines):
              if target in line:
                  start = i
                  break

          if start is None:
              print("AES literal not found.")
              print("AES fix is probably already applied.")
              raise SystemExit(0)

          for i in range(start, min(start + 20, len(lines))):
              if "v3.s[3]" in lines[i]:
                  end = i
                  break

          if end is None:
              raise SystemExit(
                  "ERROR: Could not locate AES block."
              )

          replacement = [
              "\tadd\tw7, w8, #1",
              "\tmov\tv0.16b, v4.16b",
              "\tadd\tw9, w8, #2",
              "\tmov\tv1.16b, v4.16b",
              "\tadd\tw10, w8, #3",
              "\tmov\tv2.16b, v4.16b",
              "\tmov\tv3.16b, v4.16b",
              "\trev\tw7, w7",
              "\trev\tw9, w9",
              "\trev\tw10, w10",
              "\tmov\tv1.s[3], w7",
              "\tmov\tv2.s[3], w9",
              "\tmov\tv3.s[3], w10",
          ]

          lines[start:end + 1] = replacement

          path.write_text(
              "\n".join(lines) + "\n"
          )

          print("AES Clang fix applied.")
          PY

          echo
          echo "========== VERIFY AES =========="

          if grep -q "0x30000000200000001" \
            arch/arm64/crypto/aes-modes.S
          then
            echo "ERROR: Old AES literal still exists."
            exit 1
          fi

          echo "AES fix verified."


      # ==========================================================
      # BUILD KERNEL
      # ==========================================================

      - name: Build kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64

          export CLANG="$HOME/toolchains/clang/bin"
          export GCC="$HOME/toolchains/gcc/bin"

          export PATH="$CLANG:$GCC:$PATH"

          # ARM64 target cross compiler
          export CROSS_COMPILE="$GCC/aarch64-linux-androidkernel-"

          # Clang target
          export CLANG_TRIPLE=aarch64-linux-gnu-

          # Target compiler
          export CC="$CLANG/clang"

          # Target linker/tools
          export LD="$CLANG/ld.lld"
          export AR="$CLANG/llvm-ar"
          export NM="$CLANG/llvm-nm"
          export OBJCOPY="$CLANG/llvm-objcopy"
          export OBJDUMP="$CLANG/llvm-objdump"
          export STRIP="$CLANG/llvm-strip"

          # IMPORTANT:
          # Host tools must NOT use Android GCC 4.9.
          export HOSTCC="$CLANG/clang"
          export HOSTCXX="$CLANG/clang++"
          export HOSTLD="$CLANG/ld.lld"

          echo
          echo "=========================================="
          echo "       BUILDING CAMELLIA KERNEL"
          echo "=========================================="

          echo "CC=$CC"
          echo "HOSTCC=$HOSTCC"
          echo "HOSTCXX=$HOSTCXX"
          echo "LD=$LD"
          echo "HOSTLD=$HOSTLD"
          echo "CROSS_COMPILE=$CROSS_COMPILE"

          echo
          echo "========== HOST COMPILER =========="

          "$HOSTCC" --version

          echo
          echo "========== TARGET COMPILER =========="

          "$CC" --version

          echo
          echo "========== BUILD =========="

          make -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            SUBARCH=arm64 \
            CC="$CC" \
            HOSTCC="$HOSTCC" \
            HOSTCXX="$HOSTCXX" \
            LD="$LD" \
            HOSTLD="$HOSTLD" \
            AR="$AR" \
            NM="$NM" \
            OBJCOPY="$OBJCOPY" \
            OBJDUMP="$OBJDUMP" \
            STRIP="$STRIP" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CLANG_TRIPLE="$CLANG_TRIPLE" \
            LLVM_IAS=1


      # ==========================================================
      # CHECK OUTPUT
      # ==========================================================

      - name: Check kernel output
        if: success()
        run: |
          echo "=========================================="
          echo "             KERNEL OUTPUT"
          echo "=========================================="

          find out/arch/arm64/boot \
            -maxdepth 2 \
            -type f \
            -print

          echo
          echo "========== IMAGE =========="

          ls -lh \
            out/arch/arm64/boot/Image* \
            2>/dev/null || true


      # ==========================================================
      # UPLOAD
      # ==========================================================

      - name: Upload kernel
        if: success()
        uses: actions/upload-artifact@v4

        with:
          name: Camellia-KernelSU-Next

          path: |
            out/arch/arm64/boot/Image*
            out/.config